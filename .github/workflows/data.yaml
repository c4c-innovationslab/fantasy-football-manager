name: data

on:
  schedule:
    # every four hours, July through September
    - cron: "0 */4 * 7-9 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape projections and rebuild the draft room
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
      - run: python3 -m pip install -r ./data/requirements.txt
      - run: python3 ./data/main.py
      - run: python3 ./league/build.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed league/league_data.js
          git diff --cached --quiet || git commit -m "Refresh projections and draft room data"
          git push
